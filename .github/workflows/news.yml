name: seoul-edu-news-bot

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST (오전 7시)
    - cron: "0 5  * * *"   # 14:00 KST (오후 2시)
  workflow_dispatch:
    inputs:
      date_from:
        description: "시작일 YYYY-MM-DD (비우면 오늘)"
        required: false
      date_to:
        description: "종료일 YYYY-MM-DD (비우면 시작일과 동일)"
        required: false

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date_from }}" ]; then
            ARGS="--from ${{ github.event.inputs.date_from }} --to ${{ github.event.inputs.date_to || github.event.inputs.date_from }}"
          fi
          python main.py $ARGS

      - name: Commit sent.json
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add sent.json
          git diff --staged --quiet || git commit -m "update sent history [skip ci]"
          git push
